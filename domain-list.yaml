# vm-control domain list
# 创建：vm-control domain create -f domain-list.yaml hdf-01
domains:
  - name: hdf-01
    host: 10.10.22.62
    vcpu: 2
    max_vcpu: 4
    memory: 4GiB
    max_memory: 8GiB
    root_volume: 100GiB
    volumes:
      - path: /home
    # 网络配置
    # ip: 192.168.122.200
    mgmt_nic_bridge: virbr0
    macvtap_passthrough_nics:
      - enp189s0f1
    # pci_passthrough_nics:
    #   - "0000:bd:00.0"
    #   - "0000:bd:00.1"
    # 安装方式。创建虚拟机要使用的安装方式
    # iso: /opt/iso/openEuler-22.03-LTS-SP1-everything-aarch64-dvd.iso
    domain_image: /var/lib/libvirt/images/backing_file/openeuler-2203-aarch64.qcow2
    # base_image: /var/lib/libvirt/images/backing_file/openeuler-2203-aarch64.qcow2
    # 创建虚拟机时所使用基础 XML
    xml: xml/backing_file/openeuler-2203-aarch64.xml
